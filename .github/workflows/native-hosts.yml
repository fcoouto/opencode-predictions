name: Native host checks
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-hosts:
    # This runner needs the real Desktop app, CLI, Python PTY support, and a GUI session.
    runs-on: [self-hosted, macOS, opencode-desktop]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run bundle
      - run: npm run test:installed
